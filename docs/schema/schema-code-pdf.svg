<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1240" height="980" fill="#f4f6fb"/>

  <!-- Titre -->
  <text x="620" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#1d2d62">Le code de la fonctionnalité — Remplissage automatique du PDF Bon de Commande</text>
  <text x="620" y="74" text-anchor="middle" font-size="12" fill="#64748b">Fichier : frontend/src/utils/bcPdf.js  +  bibliothèque pdf-lib (côté navigateur)</text>

  <!-- Panneau gauche : analyse préalable -->
  <rect x="30" y="110" width="270" height="300" rx="8" fill="#ffffff" stroke="#d4d9e8"/>
  <rect x="30" y="110" width="270" height="32" rx="8" fill="#203090"/>
  <rect x="30" y="132" width="270" height="10" fill="#203090"/>
  <text x="165" y="131" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">ANALYSE PRÉALABLE (hors app)</text>

  <text x="46" y="165" font-size="11" font-weight="700" fill="#0f172a">pdfplumber (Python)</text>
  <text x="46" y="186" font-size="9.5" fill="#64748b">lit le modèle Bon_de_Commande.pdf</text>
  <text x="46" y="202" font-size="9.5" fill="#64748b">et mesure la position (x, y)</text>
  <text x="46" y="218" font-size="9.5" fill="#64748b">de chaque champ imprimé.</text>

  <line x1="165" y1="228" x2="165" y2="260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="46" y="264" width="238" height="110" rx="6" fill="#e8ecf7"/>
  <text x="60" y="282" font-size="11" font-weight="700" fill="#203090">Résultat → FIELDS</text>
  <text x="60" y="304" font-size="9.5" fill="#0f172a">const FIELDS = {</text>
  <text x="60" y="320" font-size="9.5" fill="#0f172a">  fournisseurNom: { x:72, y:583 },</text>
  <text x="60" y="336" font-size="9.5" fill="#0f172a">  total: { x:518, y:255 }, ... }</text>
  <text x="60" y="360" font-size="8.5" fill="#64748b">Positions écrites en dur dans bcPdf.js</text>

  <!-- Panneau droit : flux du code -->
  <rect x="330" y="110" width="880" height="720" rx="10" fill="#ffffff" stroke="#d4d9e8"/>
  <text x="770" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#1d2d62">LE CODE (frontend/src/utils/bcPdf.js)</text>

  <!-- Boîtes d'étapes -->
  <g font-size="10.5">
    <rect x="360" y="158" width="440" height="58" rx="6" fill="#ffffff" stroke="#d4d9e8"/>
    <rect x="360" y="158" width="6" height="58" fill="#203090"/>
    <text x="380" y="180" font-weight="700" fill="#203090">1</text>
    <text x="404" y="180" font-weight="700" fill="#0f172a">Clique sur le bouton</text>
    <text x="404" y="200" font-size="9.5" fill="#64748b">PurchaseOrderList.jsx : « PDF » (un BC) ou « Exporter tous les PDF »</text>

    <rect x="360" y="236" width="440" height="58" rx="6" fill="#ffffff" stroke="#d4d9e8"/>
    <rect x="360" y="236" width="6" height="58" fill="#203090"/>
    <text x="380" y="258" font-weight="700" fill="#203090">2</text>
    <text x="404" y="258" font-weight="700" fill="#0f172a">exporterPdfUn(bc) / exporterPdfTous(bcs)</text>
    <text x="404" y="278" font-size="9.5" fill="#64748b">Point d'entrée : prépare la liste des bons à remplir</text>

    <rect x="360" y="314" width="440" height="58" rx="6" fill="#ffffff" stroke="#d4d9e8"/>
    <rect x="360" y="314" width="6" height="58" fill="#203090"/>
    <text x="380" y="336" font-weight="700" fill="#203090">3</text>
    <text x="404" y="336" font-weight="700" fill="#0f172a">fetchTemplate()</text>
    <text x="404" y="356" font-size="9.5" fill="#64748b">fetch('/Bon_de_Commande.pdf') → octets du modèle vierge</text>

    <rect x="360" y="392" width="440" height="58" rx="6" fill="#ffffff" stroke="#d4d9e8"/>
    <rect x="360" y="392" width="6" height="58" fill="#203090"/>
    <text x="380" y="414" font-weight="700" fill="#203090">4</text>
    <text x="404" y="414" font-weight="700" fill="#0f172a">pdf-lib : PDFDocument.load() + embedFont()</text>
    <text x="404" y="434" font-size="9.5" fill="#64748b">ouvre le PDF + police Helvetica</text>

    <!-- fillPage -->
    <rect x="360" y="470" width="820" height="200" rx="6" fill="#ffffff" stroke="#d4d9e8"/>
    <rect x="360" y="470" width="6" height="200" fill="#007a33"/>
    <text x="406" y="494" font-size="11" font-weight="700" fill="#007a33">5   fillPage(page, font, bc)</text>
    <text x="406" y="516" font-size="9.5" fill="#64748b">écrit chaque donnée à sa position (FIELDS) avec drawText()</text>
    <text x="406" y="546" font-size="9.5" fill="#0f172a">• en-tête : N° BC, fournisseur (nom, adresse, tél), date</text>
    <text x="406" y="570" font-size="9.5" fill="#0f172a">• tableau : lignes (produit, quantité, prix, total) — jusqu'à 6</text>
    <text x="406" y="594" font-size="9.5" fill="#0f172a">• totaux : sous-total, taxe, transport, TOTAL</text>
    <text x="406" y="618" font-size="9.5" fill="#0f172a">• signature : Autorisé par (acheteur), titre, date</text>

    <rect x="360" y="690" width="440" height="58" rx="6" fill="#ffffff" stroke="#d4d9e8"/>
    <rect x="360" y="690" width="6" height="58" fill="#203090"/>
    <text x="380" y="712" font-weight="700" fill="#203090">6</text>
    <text x="404" y="712" font-weight="700" fill="#0f172a">downloadBcPdf(bytes, nom)</text>
    <text x="404" y="732" font-size="9.5" fill="#64748b">Blob PDF → clic automatique → téléchargement du fichier rempli</text>
  </g>

  <!-- Flèches entre étapes -->
  <line x1="580" y1="216" x2="580" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="294" x2="580" y2="314" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="372" x2="580" y2="392" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="450" x2="580" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="670" x2="580" y2="690" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Boîte données -->
  <rect x="860" y="158" width="320" height="110" rx="8" fill="#ffffff" stroke="#1d2d62" stroke-width="2"/>
  <text x="880" y="182" font-size="11" font-weight="700" fill="#1d2d62">Données du bon de commande (bc)</text>
  <text x="880" y="206" font-size="9.5" fill="#0f172a">fournisseur_nom, adresse, tel,</text>
  <text x="880" y="224" font-size="9.5" fill="#0f172a">lignes [produit_nom, qte, prix], montant</text>
  <text x="880" y="250" font-size="8.5" fill="#64748b">← API backend  /  mock (si base vide)</text>
  <line x1="1020" y1="268" x2="790" y2="560" stroke="#1d2d62" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Légende -->
  <g y="900">
    <rect x="60" y="870" width="18" height="18" fill="#203090"/>
    <text x="86" y="884" font-size="9.5" fill="#0f172a">Étape du code</text>
    <rect x="200" y="870" width="18" height="18" fill="#007a33"/>
    <text x="226" y="884" font-size="9.5" fill="#0f172a">Cœur du remplissage (fillPage)</text>
    <rect x="400" y="870" width="18" height="18" fill="#e8ecf7" stroke="#d4d9e8"/>
    <text x="426" y="884" font-size="9.5" fill="#0f172a">Analyse préalable (hors app)</text>
    <rect x="640" y="870" width="18" height="18" fill="#ffffff" stroke="#1d2d62" stroke-width="2"/>
    <text x="666" y="884" font-size="9.5" fill="#0f172a">Données fournies à la fonction</text>
  </g>
</svg>
